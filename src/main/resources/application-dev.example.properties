spring.application.name=jedu-api
# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:2345/pgs
spring.datasource.username=YOUR_USERNAME  # ⇐ FILL HERE
spring.datasource.password=YOUR_PASSWORD  # ⇐ FILL HERE
# Flyway
spring.flyway.locations=classpath:db/migration
spring.threads.virtual.enabled=true
# P6Spy
decorator.datasource.p6spy.exclude-categories=info,debug,result,batch
decorator.datasource.p6spy.log-format=Completed in %(executionTime) ms\n%(sql)
# Security
jedu.api.security.allowed-methods=POST, GET, PUT, DELETE, OPTIONS
jedu.api.security.allowed-headers=Authorization, Content-Type, Accept, Origin, X-Requested-With
jedu.api.security.cors-url-pattern=/api/**
jedu.api.security.public-paths=/api/**,/v3/api-docs/**,/swagger-ui/**
jedu.web.base-url=http://localhost:5173

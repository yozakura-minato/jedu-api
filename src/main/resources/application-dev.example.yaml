spring:
  application:
    name: jeduApi
  datasource:
    url: jdbc:postgresql://localhost:2345/pg
    username: YOUR_USERNAME # <= TO FILL
    password: YOUR_PASSWORD # <= TO FILL
  flyway:
    enabled: true
    locations: classpath:db/migration
decorator:
  datasource:
    p6spy:
      enable-logging: true
      multiline: true
      logging: slf4j
      exclude-categories: info,debug,result,batch
      log-format: "Executed in %(executionTime)ms\n%(sql)"
